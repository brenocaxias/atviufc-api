# Nome da Aplicação
spring.application.name=ativufc
server.port=8080

# --- BANCO DE DADOS (A Mágica acontece aqui) ---
# No Render: Ele vai usar o que estiver antes dos dois pontos (DB_URL)
# No seu PC: Ele vai ignorar o DB_URL e usar o que está depois (jdbc:postgresql://localhost...)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ativufc}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# Se você usa Flyway, ddl-auto deve ser 'validate' ou 'none' para não conflitar
spring.jpa.hibernate.ddl-auto=none 
spring.jpa.properties.hibernate.format_sql=true

# --- FLYWAY (Migrações) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Adicione esta linha para corrigir bugs comuns de Flyway na nuvem:
spring.flyway.baseline-on-migrate=true

# --- SEGURANÇA (JWT) ---
# Tenta pegar da variável JWT_SECRET, se não achar, usa a fixa (para teste local)
security.jwt.secret=${JWT_SECRET:senhaparaautenticacaoseguracompleta1234567890ufcatividades}
security.jwt.issuer=ativufc
security.jwt.login.ttl-minutes=120
security.jwt.reset.ttl-minutes=15

# --- UPLOADS ---
# AVISO: No plano grátis do Render, arquivos salvos aqui somem após 15 minutos de inatividade
app.uploads.dir=uploads/comprovantes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO